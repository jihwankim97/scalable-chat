services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ./redis-data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
